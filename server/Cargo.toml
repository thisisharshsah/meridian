[package]
name = "suite-server"
version = "0.1.0"
edition = "2021"
description = "Rust API server for the business management suite"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "limit"] }
http = "1"

sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
  "chrono",
  "uuid",
  "json",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"

uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

thiserror = "2"
anyhow = "1"
validator = { version = "0.21", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
hmac = "0.13.0"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }

[profile.dev]
opt-level = 0
debug = 1
